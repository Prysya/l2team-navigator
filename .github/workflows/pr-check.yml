name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Type check & Build
        run: npm run build
        env:
          VITE_TELEGRAM_API_URL: ${{ secrets.VITE_TELEGRAM_API_URL }}
          VITE_TELEGRAM_API_TOKEN: ${{ secrets.VITE_TELEGRAM_API_TOKEN }}
          VITE_ADMIN_ID: ${{ secrets.VITE_ADMIN_ID }}
