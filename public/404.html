<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>L2team Navigator</title>
  <script>
    sessionStorage.redirect = location.pathname + location.search;
    var base = location.pathname.split('/').slice(0, -1).join('/') || '/';
    location.replace(base);
  </script>
</head>
<body></body>
</html>
